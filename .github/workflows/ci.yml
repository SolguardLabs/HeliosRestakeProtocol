name: ci

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install dependencies
        run: forge install foundry-rs/forge-std --no-git
      - name: Validate
        run: bash scripts/ci.sh
